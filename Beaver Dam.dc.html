<div style="position:fixed;inset:0;overflow:hidden;font-family:var(--font-body);color:#2b2416;background:url('assets/meadow.webp') center/cover no-repeat #cfe0b4">

  <div style="position:absolute;left:clamp(10px,2vw,28px);top:clamp(10px,2vh,24px);z-index:6;display:flex;gap:10px">

  <div style="position:absolute;left:clamp(220px,32vw,470px);right:clamp(10px,2vw,28px);top:calc(clamp(10px,2vh,24px) + 62px);z-index:5;max-width:900px;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,16px);padding:clamp(12px,2vh,22px) clamp(14px,2.4vw,30px);border-radius:34px;background:rgba(251,243,226,.97);border:3px solid #e2b48e;box-shadow:var(--shadow-lg);box-sizing:border-box">
    <sc-if value="{{ picking }}" hint-placeholder-val="{{ false }}">

      </div>
    </sc-if>
    <sc-if value="{{ spelling }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:clamp(14px,3vw,36px);flex-wrap:wrap;justify-content:center">
        <button type="button" onClick="{{ hearWord }}" aria-label="Hear the word" style="position:relative;display:flex;align-items:center;gap:14px;min-height:clamp(72px,12vh,100px);padding:0 36px 0 12px;border-radius:999px;background:linear-gradient(180deg,#8fa86a 0%,var(--color-accent-2-700) 100%);color:#fff;border:4px solid #2b2416;box-shadow:0 7px 0 #2b2416,inset 0 3px 0 rgba(255,255,255,.35);font-family:var(--font-heading);font-size:clamp(24px,3vw,36px);letter-spacing:.01em;text-shadow:0 2px 0 rgba(43,36,22,.45);cursor:pointer;white-space:nowrap" style-hover="filter:brightness(1.08)" style-active="transform:translateY(4px);box-shadow:0 3px 0 #2b2416"><span aria-hidden="true" style="display:grid;place-items:center;width:clamp(54px,8vh,72px);aspect-ratio:1;border-radius:999px;background:#fbf3e2;border:3px solid #2b2416;font-size:clamp(28px,4.4vh,40px);line-height:1;text-shadow:none">🔊</span>Hear the word</button>
        <div style="display:flex;gap:clamp(6px,1vw,12px)">
          <sc-for list="{{ slots }}" as="s" hint-placeholder-count="3">
            <span style="display:grid;place-items:center;width:clamp(48px,min(7vw,10vh),76px);height:clamp(56px,min(8vw,12vh),88px);border-radius:16px;background:{{ s.bg }};border:4px solid {{ s.bd }};font-family:var(--font-heading);font-size:clamp(32px,min(5vw,7vh),56px);line-height:1;color:#2f281b">{{ s.ch }}</span>
          </sc-for>
        </div>
      </div>
      <div style="display:flex;gap:clamp(8px,1.2vw,14px);flex-wrap:wrap;justify-content:center">
        <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="4">
          <button type="button" onClick="{{ t.go }}" disabled="{{ t.used }}" style="width:clamp(52px,min(7vw,10vh),78px);height:clamp(52px,min(7vw,10vh),78px);border-radius:18px;background:{{ t.bg }};border:4px solid {{ t.bd }};box-shadow:0 5px 0 {{ t.bd }};font-family:var(--font-heading);font-size:clamp(28px,min(4.4vw,6vh),46px);line-height:1;color:#2f281b;cursor:pointer;opacity:{{ t.op }};animation:{{ t.anim }}">{{ t.ch }}</button>
        </sc-for>
        <button type="button" onClick="{{ helpMe }}" style="min-height:52px;align-self:center;padding:0 16px;border-radius:999px;background:none;border:0;color:#5d4a2c;font:inherit;font-weight:800;font-size:16px;text-decoration:underline;cursor:pointer;white-space:nowrap">💡 Help me</button>
      </div>
    </sc-if>

    <sc-if value="{{ placing }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:16px">
        <span aria-hidden="true" style="width:clamp(110px,min(16vw,20vh),180px);aspect-ratio:2/1;background:url('{{ earnedSrc }}') center/contain no-repeat"></span>
        <span style="font-size:clamp(20px,min(2.4vw,4vh),28px);font-weight:800;color:#3a3122">Tap the glowing spot on the dam ⬇</span>
      </div>
    </sc-if>

    <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center">
        <a href="Garden Map.dc.html" style="display:inline-flex;align-items:center;min-height:72px;padding:0 36px;border-radius:999px;background:var(--color-accent-2-700);color:#fff;border:4px solid #2b2416;box-shadow:0 6px 0 #2b2416;font-weight:900;font-size:24px;text-decoration:none">Back to my garden</a>
        <button type="button" onClick="{{ again }}" class="btn btn-ghost" style="font-size:18px;font-weight:800">Build again</button>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ bubbleOn }}" hint-placeholder-val="{{ false }}"><div role="status" aria-live="polite" style="animation:bdChat .35s cubic-bezier(.3,1.5,.6,1);transform-origin:20% 100%;position:absolute;left:clamp(8px,1vw,16px);bottom:calc(26% + clamp(150px,min(24vw,44vh),370px));z-index:7;width:clamp(200px,30vw,430px);box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding:clamp(12px,2vh,20px) clamp(16px,2vw,24px);border-radius:30px;background:#fffaf1;border:4px solid #2b2416;box-shadow:0 6px 0 rgba(43,36,22,.3)">
    <sc-for list="{{ sayLines }}" as="l" hint-placeholder-count="1"><span style="font-family:var(--font-heading);font-size:clamp(19px,min(2.4vw,4.2vh),30px);line-height:1.15;color:#2f281b">{{ l.t }}</span></sc-for>
    <span aria-hidden="true" style="position:absolute;left:clamp(60px,10vw,150px);bottom:-19px;width:30px;height:30px;transform:rotate(45deg);background:#fffaf1;border-right:4px solid #2b2416;border-bottom:4px solid #2b2416"></span>
  </div></sc-if>
  {{ beaverNode }}
  {{ celeNode }}
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div style="pointer-events:none;position:fixed;left:50%;top:clamp(70px,12vh,110px);transform:translateX(-50%);z-index:9;padding:12px 24px;border-radius:999px;background:#2f281b;color:#fbf3e2;font-weight:800;font-size:clamp(18px,2vw,22px);white-space:nowrap">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const KEY = 'beaverDam.v1';
const B1 = 'uploads/05_IMAGES/Batch_01_Individual_PNGs/', B2 = 'uploads/05_IMAGES/Batch_02_Individual_PNGs/';
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
const GROUPS = {
  '2A': 'saw home soon stand box upon first came girl house find because made could book look mother run school people night into say think back',
  '2B': 'big where am ball morning live four last color away red friend pretty eat want year white got play found left men bring wish black',
  '2C': 'may let use these right present tell next please leave hand more why better under while should never each best another seem tree name dear',
  '2D': 'ran five read over such way too shall own most sure thing only near than open kind must high far both end also until call'
};
Object.keys(GROUPS).forEach(k => { GROUPS[k] = GROUPS[k].split(' '); });
const N = 25;
const LOGS = ['dam_01_mossy_bark_log', 'dam_02_birch_log', 'dam_03_branching_log', 'dam_04_twig_bundle', 'dam_05_round_wood_slice', 'dam_06_hollow_log', 'dam_07_forked_branch', 'dam_08_smooth_log_mushrooms', 'dam_09_branch_bundle_reeds'].map(n => 'uploads/' + n + '.webp');
const SPOTS = []; [7, 6, 5, 4, 3].forEach((n, row) => { for (let j = 0; j < n; j++) SPOTS.push([50 + (j - (n - 1) / 2) * 13.4, row * 19, 15, ((j + row) % 3 - 1) * 3]); });
const EXTRA = 'aeimprst';
const rnd = n => { const x = Math.sin(n * 91.7) * 43758.5; return x - Math.floor(x); };

class Component extends DCLogic {
  constructor(p) {
    super(p);
    let sv = null; try { sv = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    const prog = (sv && sv.prog) || {}, group = sv && sv.group;
    this.state = { prog, group: group || null, logs: group ? prog[group] || 0 : 0, typed: 0, used: [], phase: !group ? 'pick' : (prog[group] || 0) >= N ? 'done' : 'spell', wrong: -1, toast: '', mode: 'hear' };
  }
  save(group, logs) { const prog = { ...this.state.prog, [group]: logs }; try { localStorage.setItem(KEY, JSON.stringify({ group, prog })); } catch (e) {} return prog; }
  speak(t) {
    const ss = window.speechSynthesis; if (!ss || !window.SpeechSynthesisUtterance) { this.toastMsg('Sound is not working on this device.'); return; }
    try {
      if (ss.speaking || ss.pending) ss.cancel();
      ss.resume();
      const u = new SpeechSynthesisUtterance(String(t));
      const vs = ss.getVoices(), v = vs.find(x => /^en(-|_)US/i.test(x.lang) && /samantha|google us|aria|jenny|zira/i.test(x.name)) || vs.find(x => /^en(-|_)/i.test(x.lang));
      if (v) u.voice = v; u.lang = (v && v.lang) || 'en-US'; u.rate = 0.75; u.pitch = 1; u.volume = 1;
      u.onstart = () => this.setState({ talking: true });
      u.onend = u.onerror = () => this.setState({ talking: false });
      this._utt = u; ss.speak(u);
      clearTimeout(this.spT); this.spT = setTimeout(() => { if (!ss.speaking && !this.state.talking) { ss.cancel(); ss.speak(u); } }, 400);
    } catch (e) { this.toastMsg('Sound is not working on this device.'); }
  }
  toastMsg(t) { clearTimeout(this.tt); this.setState({ toast: t }); this.tt = setTimeout(() => this.setState({ toast: '' }), 2400); }
  componentWillUnmount() { clearTimeout(this.tt); clearTimeout(this.wt); clearTimeout(this.spT); clearTimeout(this.ct); clearTimeout(this.mt); clearTimeout(this.bt); try { window.speechSynthesis.cancel(); } catch (e) {} }
  tilesFor(i) {
    const w = GROUPS[this.state.group][i], pool = 'abcdefghilmnoprstuwy'.split('').filter(c => w.indexOf(c) < 0), nx = w.length <= 3 ? 3 : w.length <= 5 ? 3 : 2, extra = Array.from({ length: nx }, (_, k) => pool[Math.floor(rnd(i * 7 + k + 1) * pool.length)]).filter((c, k, a) => a.indexOf(c) === k), all = this.state.mode === 'jumble' ? w.split('') : w.split('').concat(extra);
    let out = all.map((c, k) => ({ c, r: rnd(i * 13 + k) })).sort((a, b) => a.r - b.r).map(x => x.c);
    if (out.slice(0, w.length).join('') === w || out.join('') === all.join('')) out = out.slice(1).concat(out[0]);
    if (out.slice(0, w.length).join('') === w) out = out.reverse();
    return out;
  }
  tap(k) {
    const S = this.state, w = GROUPS[S.group][S.logs], tiles = this.tilesFor(S.logs);
    if (S.used.indexOf(k) > -1) return;
    if (tiles[k] === w[S.typed]) {
      const typed = S.typed + 1, used = S.used.concat([k]);
      if (typed === w.length) { this.setState({ typed, used, phase: 'place', wrong: -1, cele: Date.now() }); clearTimeout(this.ct); clearTimeout(this.mt); clearTimeout(this.bt); this.ct = setTimeout(() => this.setState({ cele: 0 }), 3400);  }
      else { this.setState({ typed, used, wrong: -1 }); this.mood('yes'); }
    } else {
      this.setState({ wrong: k }); this.mood('oops'); clearTimeout(this.wt); this.wt = setTimeout(() => this.setState({ wrong: -1 }), 450);
      
    }
  }
  componentDidUpdate() { if (this._say !== this._shownSay) { this._shownSay = this._say; clearTimeout(this.bt); if (!this.state.bubble) this.setState({ bubble: true }); this.bt = setTimeout(() => this.setState({ bubble: false }), this._say && this._say.length > 40 ? 5200 : 3600); } }
  componentDidMount() { this.componentDidUpdate(); }
  mood(m) { clearTimeout(this.mt); this.setState({ mood: m, moodN: (this.state.moodN || 0) + 1 }); this.mt = setTimeout(() => this.setState({ mood: null }), 1500); }
  pickGroup(gk) { const logs = this.state.prog[gk] || 0; try { localStorage.setItem(KEY, JSON.stringify({ group: gk, prog: this.state.prog })); } catch (e) {} this.setState({ group: gk, logs, typed: 0, used: [], phase: logs >= N ? 'done' : 'spell' }); }
  renderVals() {
    const S = this.state, gk = S.group, list = gk ? GROUPS[gk] : [], i = Math.min(S.logs, N - 1), w = list[i] || '', tiles = gk ? this.tilesFor(i) : [];
    const ph = S.phase, picking = ph === 'pick', looking = ph === 'look', spelling = ph === 'spell', placing = ph === 'place', done = ph === 'done';
    const MOODSAY = { yes: ['Yes! Keep going!', 'Great job! Next letter!', 'You got it! Keep going!'], oops: ['Almost! Try another letter.', 'So close! You can do it.', 'Oops! Try a different one.'], help: ['Here is a hint for you!'] };
    const moodSay = spelling && S.mood ? MOODSAY[S.mood][(S.moodN || 0) % MOODSAY[S.mood].length] : '';
    const say = moodSay ? moodSay : picking ? 'Hi friend! Pick your word list.' : done ? 'We did it! We built a dam! The water is a pond now.' : placing ? 'Wow, great spelling! Put your log on the dam.' : (S.logs ? 'You are doing great! ' : 'Hi! I need logs for my dam. ') + (S.mode === 'jumble' ? 'These letters are all mixed up! Tap them in the right order.' : 'Listen to the word. Then spell it!');
    const dam = SPOTS.map(([x, y, wd, rot], k) => ({ x, y, w: wd, rot, src: LOGS[k % LOGS.length], op: k < S.logs ? 1 : 0, ghost: 'none', ghostDisp: k < S.logs || picking ? 'none' : 'block' }));
    const nx = SPOTS[Math.min(S.logs, N - 1)];
    return {
      bubbleOn: (this._say = say, !!S.bubble || S.phase === 'pick'), say, sayLines: (say.match(/[^.!?]+[.!?]+/g) || [say]).map(t => ({ t: t.trim() })), picking, looking, spelling, placing, done,
      groups: Object.keys(GROUPS).map(k => ({ name: 'Group ' + k, sub: (S.prog[k] || 0) + ' of ' + N + ' logs', bd: k === gk ? '#f5b82e' : '#2b2416', go: () => this.pickGroup(k) })),
      changeList: () => this.setState({ phase: 'pick' }), hasGroup: !!gk && !picking, groupName: gk ? 'Group ' + gk : '',
      modes: [['hear', '🔊', 'Hear & spell'], ['jumble', '🔀', 'Unscramble']].map(([id, ic, label]) => { const on = (S.mode || 'hear') === id; return { ic, label, bg: on ? 'var(--color-accent-2-700)' : '#fff', fg: on ? '#fff' : '#2f281b', bd: on ? '#2b2416' : '#c9b58e', go: () => { if (on) return; try { localStorage.setItem(KEY + '.mode', id); } catch (e) {} this.setState({ mode: id, typed: 0, used: [], wrong: -1 }); } }; }),
      lookWord: w, ready: () => this.setState({ phase: 'spell' }), peek: () => this.setState({ phase: 'look' }),
      slots: w.split('').map((c, k) => ({ ch: k < S.typed ? c : '', bg: k < S.typed ? '#fff3c9' : '#fff', bd: k === S.typed && spelling ? '#f5b82e' : '#2b2416' })),
      tiles: tiles.map((c, k) => { const used = S.used.indexOf(k) > -1, bad = S.wrong === k; return { ch: c, used, op: used ? 0.25 : 1, bg: bad ? '#f6c9c2' : '#fff', bd: bad ? '#c8372d' : '#2b2416', anim: bad ? 'bdNo .4s' : 'none', go: () => this.tap(k) }; }),
      helpMe: () => { this.mood('help'); const k = tiles.findIndex((c, j) => c === w[S.typed] && S.used.indexOf(j) < 0); if (k > -1) this.tap(k); },
      hearWord: () => this.speak(w),
      hear: () => this.speak(picking || placing || done ? say : w + '. ' + w.split('').join(', ') + '. ' + w),
      dam, next: { x: nx[0], y: nx[1], w: nx[2] },
      earnedSrc: LOGS[Math.min(S.logs, N - 1) % LOGS.length],
      placeLog: () => { const logs = S.logs + 1, prog = this.save(gk, logs); this.setState({ prog, logs, typed: 0, used: [], phase: logs >= N ? 'done' : 'spell' }); this.toastMsg(logs >= N ? 'The dam is done! Water fills up behind it.' : 'The dam is getting taller!'); },
      again: () => { const prog = this.save(gk, 0); this.setState({ prog, logs: 0, typed: 0, used: [], phase: 'spell' }); },
      damScale: placing ? 1.25 : done ? 1.15 : 0.72, damZ: placing || done ? 8 : 3,
      damGlow: (() => { const p = S.logs / N; if (p <= 0) return 'none'; const a = (0.25 + p * 0.65).toFixed(2), b = Math.round(6 + p * 26); return 'drop-shadow(0 0 ' + b + 'px rgba(255,214,90,' + a + ')) saturate(' + (1 + p * 0.3).toFixed(2) + ') brightness(' + (1 + p * 0.12).toFixed(2) + ')'; })(),
      logCount: S.logs + ' of ' + N + ' logs',
      poolH: (4 + S.logs * 1.25) + '%',
      beaverNode: (() => { const pose = S.cele || done ? 10 : placing ? 6 : picking ? 7 : S.mood === 'yes' ? 1 : S.mood === 'oops' ? 3 : S.mood === 'help' ? 8 : 2;
        return React.createElement('img', { key: 'bv' + pose + '-' + (S.moodN || 0), src: 'assets/bv' + pose + '.webp', alt: 'Beaver', style: { position: 'absolute', left: 'clamp(0px,1vw,16px)', bottom: '26%', zIndex: 6, width: 'clamp(170px,min(26vw,48vh),400px)', height: 'auto', filter: 'drop-shadow(0 10px 12px rgba(60,40,10,.35))', transformOrigin: '50% 100%', animation: 'bdHop .5s ease-out', pointerEvents: 'none' } }); })(),
      hasToast: !!S.toast, toast: S.toast,
      celeNode: S.cele ? (() => { const h = React.createElement, C = ['#f5b82e', '#e0584a', '#6fbf5a', '#4f93b3', '#c67139', '#b07ad6', '#ffffff'];
        return h('div', { key: 'c' + S.cele, style: { position: 'fixed', inset: 0, zIndex: 20, pointerEvents: 'none', overflow: 'hidden' } },
          ...Array.from({ length: 70 }, (_, k) => h('span', { key: 'f' + k, style: { position: 'absolute', left: (rnd(k + 1) * 100) + '%', top: 0, width: 8 + rnd(k + 2) * 8, height: 12 + rnd(k + 3) * 10, borderRadius: k % 3 ? 3 : 999, background: C[k % C.length], '--dx': ((rnd(k + 4) - 0.5) * 30) + 'vw', '--rot': (360 + rnd(k + 5) * 720) + 'deg', animation: 'bdConf ' + (1.8 + rnd(k + 6) * 1.4) + 's ' + (rnd(k + 7) * 0.5) + 's cubic-bezier(.3,.6,.5,1) forwards', opacity: 0 } })),
          ...Array.from({ length: 12 }, (_, k) => h('span', { key: 'b' + k, style: { position: 'absolute', left: (8 + rnd(k + 40) * 84) + '%', bottom: '8%', fontSize: 'clamp(34px,' + (4 + rnd(k + 41) * 3) + 'vw,72px)', lineHeight: 1, '--dx': ((rnd(k + 42) - 0.5) * 40) + 'vw', animation: 'bdFly ' + (2.4 + rnd(k + 43) * 0.9) + 's ' + (rnd(k + 44) * 0.6) + 's ease-in-out forwards', opacity: 0 } }, h('span', { style: { display: 'inline-block', animation: 'bdFlap .28s ease-in-out infinite' } }, '🦋'))),
          h('span', { key: 'w', style: { position: 'absolute', left: '50%', top: '46%', padding: '14px 40px', borderRadius: 999, background: '#fbf3e2', border: '4px solid #2b2416', boxShadow: '0 8px 0 #2b2416', fontFamily: 'var(--font-heading)', fontSize: 'clamp(40px,7vw,96px)', color: '#2f281b', whiteSpace: 'nowrap', animation: 'bdPop 2.6s ease-out forwards' } }, '✨ ' + w + ' ✨'));
      })() : null
    };
  }
}
</script>
