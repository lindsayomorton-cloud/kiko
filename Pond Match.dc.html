@keyframes pmWig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) scale(1.05)}75%{transform:rotate(6deg) scale(1.05)}}

        <span style="font-family:var(--font-heading);font-size:clamp(44px,6vw,84px);line-height:1;color:#4a2e0a">{{ winTitle }}</span>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const B2 = 'uploads/05_IMAGES/Batch_02_Individual_PNGs/', KOI = 'uploads/05_IMAGES/Batch_01_Individual_PNGs/watercolor_kohaku_koi_fish.webp', BL = 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';

class Component extends DCLogic {

      problemTxt: p ? (S.fixed ? 'Fixed! No more ' + p[2].toLowerCase() + '!' : 'Uh oh! ' + p[2] + '!') : '', problemC: S.fixed ? '#2f5a10' : '#c8372d',
      sceneSrc: p ? p[3] : BL, sceneF: p ? (S.fixed ? 'none' : p[4]) : 'none', sceneBd: S.fixed ? '#8fb36a' : S.tried ? '#c8372d' : S.drag ? '#ffd166' : '#ecdcbc', sceneAnim: S.tried ? 'pmNo .4s ease' : 'none', sceneTap: () => {},
      clues: p && S.step === 'look' ? p[5].map((lbl, j) => { const f = S.found.indexOf(j) > -1; return { l: CPOS[j][0], t: CPOS[j][1], lbl, dotDisp: f ? 'none' : 'grid', lblDisp: f ? 'block' : 'none', go: e => { e.stopPropagation(); if (f) return; const nf = S.found.concat([j]); this.setState({ found: nf }); if (nf.length >= 2) { clearTimeout(this.ft); this.ft = setTimeout(() => this.setState({ step: 'why' }), 1200); } } }; }) : [],
      overDisp: p && (S.fixed || S.tried) ? 'block' : 'none', overSrc: p ? (S.fixed ? p[1] : S.tried ? P[S.tried][1] : BL) : BL, overF: S.tried ? 'grayscale(.3)' : '',
      ask, opts, optsDisp,
      nextDisp: p && S.fixed ? 'inline-flex' : 'none', nextTxt: S.i >= 2 ? 'Finish round' : 'Next problem', nextGo: () => this.next(),
      hintGo: () => { if (!p) return; clearTimeout(this.tt); this.setState({ wig: S.step === 'why' ? 'w' + p[7] : 'f' + k }); this.tt = setTimeout(() => this.setState({ wig: null }), 1700); },
      cards: cards.map((c, j) => { const up = S.flip.indexOf(j) > -1 || S.foundF.indexOf(c.k) > -1, f = S.foundF.indexOf(c.k) > -1; return { bg: up ? '#ffffff' : '#2f5f58', bd: f ? '#8fb36a' : up ? '#ffd166' : '#1f423d', backDisp: up ? 'none' : 'block', imgDisp: up ? 'block' : 'none', txtDisp: up ? 'block' : 'none', src: c.kind === 'p' ? P[c.k][1] : P[c.k][3], t: c.kind === 'p' ? P[c.k][0] : P[c.k][2], go: () => { if (S.flip.length >= 2 || up) return; const fl = S.flip.concat([j]); this.setState({ flip: fl }); if (fl.length === 2) { const [a, b] = fl.map(x => cards[x]); clearTimeout(this.ft); if (a.k === b.k) this.ft = setTimeout(() => this.setState(st => ({ foundF: st.foundF.concat([a.k]), flip: [] })), 500); else this.ft = setTimeout(() => this.setState({ flip: [] }), 1200); } } }; }),
      dragging: !!S.drag, dragX: S.drag ? S.drag.x : 0, dragY: S.drag ? S.drag.y : 0, dragSrc: S.drag ? P[S.drag.k][1] : BL,
      hasMsg: !!S.msg, msg: S.msg, msgBd: S.msgOk ? '#8fb36a' : '#e07a2e',
      hasWin: S.won || flipWin, winTitle: lastRound ? 'You did it all!' : 'Great job!', stars: [0, 1, 2].map(j => ({ c: j < nStars ? '#ffffff' : 'rgba(255,255,255,.35)', d: (0.2 + j * 0.25) + 's' })),
      roundTxt: lastRound ? 'Play again' : S.r === ROUNDS.length - 1 ? 'Bonus round' : 'Next round',
      roundGo: () => this.setState({ r: lastRound ? 0 : S.r + 1, i: 0, step: 'look', found: [], fixed: false, tried: null, bad: null, miss: 0, won: false, flip: [], foundF: [], msg: '' })
    };
  }
}
