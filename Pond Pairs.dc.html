<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-3bf144cd-0f77-4d21-b523-8671b888de01/styles.css">
<script src="_ds/organic-3bf144cd-0f77-4d21-b523-8671b888de01/_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1d3b3a}a{color:var(--color-accent-700)}a:hover{color:var(--color-accent-800)}
@keyframes ppFly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}50%{transform:translate(30px,-40px)}85%{opacity:1}100%{transform:translate(-20px,-90px);opacity:0}}
@keyframes ppSpark{0%{transform:translate(-50%,-50%) scale(0) rotate(0);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(180deg);opacity:0}}
@keyframes ppBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ppRing{0%{transform:translate(-50%,-50%) scale(.2);opacity:.9}100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
@keyframes ppJump{0%,100%{transform:none}30%{transform:translateY(-14px) scale(1.08) rotate(-3deg)}60%{transform:translateY(-6px) scale(1.04) rotate(2deg)}}
@keyframes ppHero{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}20%{transform:translate(-50%,-50%) scale(1.1) rotate(3deg);opacity:1}35%{transform:translate(-50%,-50%) scale(1)}80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(.6) translateY(-40px);opacity:0}}
@keyframes ppRay{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes ppVeil{0%,100%{opacity:0}20%,80%{opacity:1}}
@keyframes ppRise{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-55vh) scale(1);opacity:0}}
@keyframes ppPop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
@keyframes ppShine{0%{background-position:-160% 0}100%{background-position:260% 0}}</style>
</helmet>
<div style="position:fixed;inset:0;display:flex;flex-direction:column;gap:clamp(10px,2vh,18px);padding:clamp(12px,2.6vh,26px) clamp(14px,3vw,40px);box-sizing:border-box;font-family:var(--font-body);background:linear-gradient(rgba(16,44,52,.55),rgba(30,58,40,.62)),url('assets/garden_sunset.webp') center/cover no-repeat;overflow:hidden">
  <sc-for list="{{ flies }}" as="f" hint-placeholder-count="0"><span aria-hidden="true" style="position:absolute;left:{{ f.l }};top:{{ f.t }};width:{{ f.s }};height:{{ f.s }};border-radius:999px;background:#fff3b0;box-shadow:0 0 12px 4px rgba(255,236,150,.8);animation:ppFly {{ f.d }} ease-in-out {{ f.dl }} infinite;pointer-events:none"></span></sc-for>
  <div style="position:relative;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <a href="Ecosystem Builder.dc.html" aria-label="Back to pond" style="display:grid;place-items:center;width:48px;height:48px;border-radius:999px;background:rgba(255,250,241,.8);font-size:24px;color:#2b2416;text-decoration:none">←</a>
    <span style="font-family:var(--font-heading);font-size:clamp(32px,4vw,54px);line-height:1;color:#fff3c8;text-shadow:0 0 18px rgba(255,220,120,.6)">Pond Pairs</span>
    <div style="display:flex;gap:6px;align-items:center;padding:8px 16px;border-radius:999px;background:rgba(255,250,241,.92)">
      <sc-for list="{{ dots }}" as="d" hint-placeholder-count="8"><span style="width:clamp(14px,1.6vw,20px);aspect-ratio:1;border-radius:999px;background:{{ d.bg }};box-shadow:{{ d.sh }};transition:background 300ms ease"></span></sc-for>
    </div>
    <div style="margin-left:auto;display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,250,241,.92)">
      <sc-for list="{{ levels }}" as="m" hint-placeholder-count="3"><button type="button" onClick="{{ m.go }}" style="min-height:50px;padding:0 20px;border-radius:999px;border:0;background:{{ m.bg }};font-family:var(--font-heading);font-size:clamp(18px,1.9vw,24px);color:#2b2416;cursor:pointer">{{ m.t }}</button></sc-for>
    </div>
  </div>
  <div style="position:relative;flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat({{ cols }},minmax(0,1fr));gap:clamp(8px,1.4vw,18px);width:min(100%,calc((100vh - 140px) * {{ ratio }}));align-self:center;perspective:1200px">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="16">
      <button type="button" onClick="{{ c.go }}" aria-label="{{ c.aria }}" style="position:relative;min-height:0;padding:0;border:0;background:none;cursor:pointer;animation:{{ c.anim }}">
        <span style="position:absolute;inset:0;display:block;transform-style:preserve-3d;transform:rotateY({{ c.rot }});transition:transform 520ms cubic-bezier(.3,1.3,.5,1)">
          <span style="position:absolute;inset:0;display:grid;place-items:center;border-radius:24px;backface-visibility:hidden;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.18),transparent 55%),url('assets/lily2.webp') center/86% no-repeat,linear-gradient(160deg,#3f8a7a,#245a55);border:4px solid #e8c873;box-shadow:0 6px 0 #173b37,0 10px 22px rgba(0,0,0,.35);overflow:hidden"><span style="position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%) 0 0/200% 100% no-repeat;animation:ppShine 4.5s ease-in-out {{ c.dl }} infinite"></span></span>
          <span style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;box-sizing:border-box;border-radius:24px;backface-visibility:hidden;transform:rotateY(180deg);background:radial-gradient(circle at 50% 40%,#ffffff,#fdf3dc);border:5px solid {{ c.bd }};box-shadow:0 6px 0 #d9c393,{{ c.glow }}"><span aria-hidden="true" style="flex:1 1 0;min-height:0;width:100%;background:url('{{ c.src }}') center/contain no-repeat"></span><span style="font-family:var(--font-heading);font-size:clamp(14px,1.6vw,22px);line-height:1;color:#2b2416">{{ c.name }}</span></span>
        </span>
        <sc-for list="{{ c.rings }}" as="r" hint-placeholder-count="0"><span aria-hidden="true" style="position:absolute;left:50%;top:50%;width:90%;aspect-ratio:1;border-radius:999px;border:4px solid rgba(255,236,150,.9);box-shadow:0 0 18px rgba(255,220,120,.7);animation:ppRing 1.1s ease-out {{ r.dl }} both;pointer-events:none;z-index:2"></span></sc-for><sc-for list="{{ c.sparks }}" as="s" hint-placeholder-count="0"><span aria-hidden="true" style="position:absolute;left:50%;top:50%;width:16px;height:16px;--dx:{{ s.dx }};--dy:{{ s.dy }};background:#ffe27a;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:ppSpark .9s ease-out both;pointer-events:none;z-index:3"></span></sc-for>
      </button>
    </sc-for>
  </div>
  <sc-if value="{{ hasMsg }}" hint-placeholder-val="{{ false }}"><div role="status" key="{{ heroKey }}" style="position:fixed;inset:0;z-index:20;pointer-events:none">
    <span style="position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,rgba(255,230,150,.35),rgba(10,30,30,.55) 60%);animation:ppVeil 2.2s ease both"></span>
    <span style="position:absolute;left:50%;top:46%;width:min(80vh,80vw);aspect-ratio:1;background:repeating-conic-gradient(rgba(255,236,160,.28) 0 8deg,transparent 8deg 22deg);border-radius:999px;-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:ppRay 6s linear infinite"></span>
    <sc-for list="{{ rise }}" as="b" hint-placeholder-count="0"><span style="position:absolute;left:{{ b.l }};bottom:-20px;width:{{ b.s }};aspect-ratio:1;border-radius:999px;background:radial-gradient(circle at 35% 30%,#ffffff,rgba(255,255,255,.2) 45%,rgba(200,240,255,.15));border:2px solid rgba(255,255,255,.7);animation:ppRise {{ b.d }} ease-out {{ b.dl }} both"></span></sc-for>
    <div style="position:absolute;left:50%;top:46%;display:flex;flex-direction:column;align-items:center;gap:10px;animation:ppHero 2.2s cubic-bezier(.3,1.4,.5,1) both">
      <span style="width:clamp(150px,30vh,280px);aspect-ratio:1;border-radius:999px;background:url('{{ heroSrc }}') center/76% no-repeat,radial-gradient(circle at 50% 40%,#ffffff,#fdf0cf);border:6px solid #e8c873;box-shadow:0 0 0 10px rgba(255,236,150,.35),0 0 60px 20px rgba(255,220,120,.6)"></span>
      <span style="padding:10px 30px;border-radius:999px;background:#fffaf1;border:4px solid #e8c873;font-family:var(--font-heading);font-size:clamp(30px,4vw,54px);line-height:1;color:#2f5a10;white-space:nowrap">{{ msg }}</span>
    </div>
  </div></sc-if>
  <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(10,30,30,.5)">
      <div style="display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.4vh,22px);padding:clamp(24px,4vh,44px) clamp(30px,5vw,64px);border-radius:44px;background:#fffaf1;border:5px solid #e8c873;box-shadow:0 8px 0 #d9c393,0 0 60px rgba(255,220,120,.5);animation:ppPop .5s cubic-bezier(.3,1.5,.5,1) both">
        <span style="font-family:var(--font-heading);font-size:clamp(40px,5.4vw,76px);line-height:1;color:#2f5a10">All pairs found!</span>
        <span style="display:flex;gap:10px"><sc-for list="{{ stars }}" as="st" hint-placeholder-count="3"><span style="font-size:clamp(44px,6vw,72px);line-height:1;color:{{ st.c }};text-shadow:0 0 14px rgba(255,200,80,.6)">★</span></sc-for></span>
        <span style="font-weight:700;font-size:clamp(22px,2.4vw,30px);color:#2b2416">{{ tries }}</span>
        <button type="button" onClick="{{ reset }}" style="min-height:80px;padding:0 44px;border-radius:999px;background:#ffd166;border:0;box-shadow:0 6px 0 #e3a92e;font-family:var(--font-heading);font-size:clamp(26px,3vw,36px);color:#4a2e0a;cursor:pointer">Play again →</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const B2 = 'uploads/05_IMAGES/Batch_02_Individual_PNGs/';
const ALL = [['uploads/05_IMAGES/Batch_01_Individual_PNGs/watercolor_kohaku_koi_fish.webp', 'Kiko'], ['assets/lily2.webp', 'Water lily'], ['assets/n_snail.webp', 'Snail'], [B2 + 'watercolor_daphnia_with_embryos.webp', 'Water flea'], ['assets/n_eelgrass.webp', 'Tape grass'], [B2 + 'watercolor_fathead_minnow_illustration.webp', 'Minnow'], ['uploads/bacteria_helper.webp', 'Helper'], [B2 + 'watercolor_fingernail_clam_on_pebbles.webp', 'Clam'], [B2 + 'watercolor_cyclops_copepod_illustration.webp', 'Copepod'], ['assets/n_bubbles.webp', 'Bubbles']];
const LV = [[6, 4, 3, 1.25], [8, 4, 4, 1.15], [10, 5, 4, 1.45]];
const deal = n => { const a = ALL.slice(0, n).flatMap((p, i) => [i, i]); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const FLIES = Array.from({ length: 14 }, (_, i) => ({ l: (7 + (i * 37) % 88) + '%', t: (10 + (i * 53) % 80) + '%', s: (4 + (i % 3) * 2) + 'px', d: (6 + (i % 5)) + 's', dl: (i * 0.7) + 's' }));
const RISE = Array.from({ length: 12 }, (_, i) => ({ l: (6 + (i * 41) % 88) + '%', s: (14 + (i % 4) * 10) + 'px', d: (1.6 + (i % 3) * 0.4) + 's', dl: (i * 0.08).toFixed(2) + 's' }));
const SPK = Array.from({ length: 12 }, (_, i) => { const a = i / 12 * Math.PI * 2; return { dx: Math.round(Math.cos(a) * 110) + 'px', dy: Math.round(Math.sin(a) * 110) + 'px' }; });
class Component extends DCLogic {
  state = { lv: 0, d: deal(6), up: [], got: [], moves: 0, burst: null, msg: '', seed: 0 };
  componentWillUnmount() { clearTimeout(this.t); clearTimeout(this.mt); }
  flip(i) {
    const S = this.state; if (S.up.length >= 2 || S.up.indexOf(i) > -1 || S.got.indexOf(S.d[i]) > -1) return;
    const up = S.up.concat([i]); this.setState({ up }); if (up.length < 2) return;
    const [a, b] = up, hit = S.d[a] === S.d[b]; this.setState({ moves: S.moves + 1 }); clearTimeout(this.t);
    this.t = setTimeout(() => { if (hit) { clearTimeout(this.mt); this.setState(st => ({ got: st.got.concat([S.d[a]]), up: [], burst: S.d[a], msg: ALL[S.d[a]][1] + '! A match!', seed: st.seed + 1 })); this.mt = setTimeout(() => this.setState({ msg: '', burst: null }), 2200); } else this.setState({ up: [] }); }, hit ? 600 : 1100);
  }
  reset(lv) { const L = lv ?? this.state.lv; clearTimeout(this.t); this.setState({ lv: L, d: deal(LV[L][0]), up: [], got: [], moves: 0, burst: null, msg: '', seed: this.state.seed + 1 }); }
  renderVals() {
    const S = this.state, [n, cols, , ratio] = LV[S.lv], done = S.got.length === n, extra = S.moves - n, nStars = extra <= 2 ? 3 : extra <= 6 ? 2 : 1;
    return {
      flies: FLIES, cols, ratio,
      levels: [['Easy', 0], ['Medium', 1], ['Hard', 2]].map(([t, v]) => ({ t, bg: S.lv === v ? '#8fb36a' : 'transparent', go: () => this.reset(v) })),
      dots: Array.from({ length: n }, (_, i) => ({ bg: i < S.got.length ? '#ffd166' : '#e3d9c2', sh: i < S.got.length ? '0 0 8px rgba(255,200,80,.9)' : 'none' })),
      cards: S.d.map((v, i) => { const got = S.got.indexOf(v) > -1, show = got || S.up.indexOf(i) > -1; return { rot: show ? '180deg' : '0deg', src: ALL[v][0], name: ALL[v][1], aria: show ? ALL[v][1] : 'Hidden card', bd: got ? '#8fb36a' : '#e8c873', glow: got ? '0 0 22px rgba(255,220,120,.75)' : '0 10px 22px rgba(0,0,0,.25)', dl: (i * 0.04).toFixed(2) + 's', anim: S.burst === v ? 'ppJump .7s ease both' : 'ppPop .4s cubic-bezier(.3,1.5,.5,1) ' + (i * 0.04).toFixed(2) + 's both', rings: S.burst === v ? [{ dl: '0s' }, { dl: '.25s' }, { dl: '.5s' }] : [], sparks: S.burst === v ? SPK.map((s, k) => ({ ...s, k: S.seed + '-' + k })) : [], go: () => this.flip(i) }; }),
      hasMsg: !!S.msg && !done, msg: S.msg, heroKey: 'h' + S.seed, heroSrc: S.burst != null ? ALL[S.burst][0] : '', rise: S.msg ? RISE : [],
      done, stars: [0, 1, 2].map(j => ({ c: j < nStars ? '#ffc93c' : '#e3d9c2' })), tries: 'You did it in ' + S.moves + ' tries.',
      reset: () => this.reset()
    };
  }
}
</script>
</body>
</html>
